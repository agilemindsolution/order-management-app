<div class="min-h-screen bg-gray-950 relative overflow-hidden">
  <!-- Grid Background -->
  <div class="absolute inset-0 bg-grid-white/[0.05]"></div>

  <div class="relative z-10 container mx-auto px-4 py-8">
    <!-- Header -->
    <div
      class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 space-y-4 md:space-y-0"
    >
      <div>
        <div class="flex items-center space-x-3 mb-2">
          <div class="p-2 bg-blue-600/20 rounded-lg">
            <mat-icon class="text-blue-400">shopping_cart</mat-icon>
          </div>
          <h1
            class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent"
          >
            Orders
          </h1>
        </div>
        <p class="text-gray-400">Manage and track all orders</p>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center space-x-3">
        <button
          mat-raised-button
          color="primary"
          (click)="handleAddOrder()"
          class="flex items-center space-x-2"
        >
          <mat-icon>add_circle</mat-icon>
          <span>Add Order</span>
        </button>

        <button
          mat-stroked-button
          [disabled]="isRefreshing"
          (click)="loadOrders()"
          class="flex items-center space-x-2"
        >
          <mat-icon [class.animate-spin]="isRefreshing">refresh</mat-icon>
          <span>{{ isRefreshing ? 'Refreshing...' : 'Refresh' }}</span>
        </button>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="mb-6">
      <div class="relative max-w-md">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <mat-icon class="text-gray-400">search</mat-icon>
        </div>
        <input
          type="text"
          [(ngModel)]="searchTerm"
          (input)="onSearchChange()"
          placeholder="Search by ID, customer, or status..."
          class="pl-10 p-2 text-sm w-full rounded-lg border border-blue-900/30 bg-gray-800/50 focus:ring-blue-500 focus:border-blue-500 text-gray-200 transition-all duration-300 focus:bg-gray-800/80"
        />
      </div>
    </div>

    <!-- Orders Table -->
    <mat-card class="modern-card bg-gray-900/60 backdrop-blur-md border border-blue-900/30">
      <app-order-table
        [orders]="filteredOrders"
        [isLoading]="isLoading"
        (edit)="handleEditOrder($event)"
        (delete)="handleDeleteOrder($event)"
        (view)="handleViewOrder($event)"
      >
      </app-order-table>
    </mat-card>
  </div>

  <!-- Order Form Modal -->
  <div *ngIf="showForm" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <app-order-form [order]="editingOrder" (close)="handleCloseForm()"> </app-order-form>
  </div>

  <!-- Order Detail Modal -->
  <div
    *ngIf="viewingOrder"
    class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4"
  >
    <app-order-detail
      [order]="viewingOrder!"
      (close)="handleCloseDetail()"
      (edit)="handleEditOrder(viewingOrder!); handleCloseDetail()"
    >
    </app-order-detail>
  </div>
</div>
