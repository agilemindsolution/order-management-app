<div class="min-h-screen bg-gray-950 relative overflow-hidden">
  <!-- Grid Background -->
  <div class="absolute inset-0 bg-grid-white/[0.05]"></div>

  <div class="relative z-10 container mx-auto px-4 py-8">
    <!-- Header -->
    <div
      class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 space-y-4 md:space-y-0"
    >
      <div>
        <div class="flex items-center space-x-3 mb-2">
          <div class="p-2 bg-green-600/20 rounded-lg">
            <mat-icon class="text-green-400">people</mat-icon>
          </div>
          <h1
            class="text-3xl font-bold bg-gradient-to-r from-green-400 to-blue-400 bg-clip-text text-transparent"
          >
            Customers
          </h1>
        </div>
        <p class="text-gray-400">Manage your customer database</p>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center space-x-3">
        <button
          mat-raised-button
          color="primary"
          (click)="handleAddCustomer()"
          class="flex items-center space-x-2"
        >
          <mat-icon>add_circle</mat-icon>
          <span>Add Customer</span>
        </button>

        <button
          mat-stroked-button
          [disabled]="isRefreshing"
          (click)="loadCustomers()"
          class="flex items-center space-x-2"
        >
          <mat-icon [class.animate-spin]="isRefreshing">refresh</mat-icon>
          <span>{{ isRefreshing ? 'Refreshing...' : 'Refresh' }}</span>
        </button>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="mb-6">
      <div class="relative max-w-md">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <mat-icon class="text-gray-400">search</mat-icon>
        </div>
        <input
          type="text"
          [(ngModel)]="searchTerm"
          (input)="onSearchChange()"
          placeholder="Search by name, email, or phone..."
          class="pl-10 p-2 text-sm w-full rounded-lg border border-blue-900/30 bg-gray-800/50 focus:ring-green-500 focus:border-green-500 text-gray-200 transition-all duration-300 focus:bg-gray-800/80"
        />
      </div>
    </div>

    <!-- Customers Table -->
    <mat-card class="modern-card bg-gray-900/60 backdrop-blur-md border border-blue-900/30">
      <app-customer-table
        [customers]="filteredCustomers"
        [isLoading]="isLoading"
        (edit)="handleEditCustomer($event)"
        (delete)="handleDeleteCustomer($event)"
        (view)="handleViewCustomer($event)"
      >
      </app-customer-table>
    </mat-card>
  </div>

  <!-- Customer Form Modal -->
   @if (showForm) {
  <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <app-customer-form [customer]="editingCustomer" (close)="handleCloseForm()">
    </app-customer-form>
  </div>
   }
  <!-- Customer Detail Modal -->
  @if (viewingCustomer) {
  <div
    class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4"
  >
    <app-customer-detail
      [customer]="viewingCustomer!"
      (close)="handleCloseDetail()"
      (edit)="handleEditCustomer(viewingCustomer!); handleCloseDetail()"
    >
    </app-customer-detail>
  </div>
}
</div>
